<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lfbg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8978AB"/>
      <stop offset="1" stop-color="#C08697"/>
    </linearGradient>
    <linearGradient id="lfshine" x1="0" y1="0" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="11" fill="url(#lfbg)"/>

  <!-- Inner top-shine for depth -->
  <rect width="40" height="20" rx="11" fill="url(#lfshine)"/>

  <!-- Bloom mark: two soft overlapping circles -->
  <circle cx="15.5" cy="16" r="9" fill="white" opacity="0.95"/>
  <circle cx="25" cy="25" r="7.5" fill="white" opacity="0.5"/>
</svg>
